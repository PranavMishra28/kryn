<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskboardLite</title><link rel="stylesheet" href="/style.css"><main><h1>TaskboardLite</h1><p>Disposable project time entries</p><form id="entry-form"><label>ID<input name="id" required></label><label>Project<input name="project" required></label><label>Minutes<input name="minutes" type="number" min="0" step="1" required></label><label>Date<input name="date" type="date" required></label><button type="submit">Save</button></form><p id="message" role="status" aria-live="polite"></p><label>Filter project<input id="filter"></label><button id="apply-filter">Filter</button><ul id="entries"></ul><label>Import CSV<input id="upload" type="file" accept=".csv,text/csv"></label><button id="import">Import</button><a href="/api/export" download="entries.csv">Export CSV</a></main><script src="/app.js"></script></html>
