<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc">
  <title id="title">KRYN: a local coding workspace you supervise</title>
  <desc id="desc">Your project connects to OpenCode for planning, edits, tests and browser tools. OpenCode uses a local Qwen model served by oMLX. KRYN provides installation, resource guards, session evidence and recovery. You review the diff and running application.</desc>
  <rect width="1120" height="360" rx="20" fill="#111827"/>
  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="40" y="58" fill="#f8fafc" font-size="28" font-weight="700">Your project. Local inference. Your decision.</text>
    <text x="40" y="88" fill="#cbd5e1" font-size="16">KRYN · supervised coding on Apple Silicon</text>
    <g fill="#1e293b" stroke="#475569" stroke-width="1.5">
      <rect x="40" y="126" width="290" height="114" rx="12"/>
      <rect x="414" y="126" width="292" height="114" rx="12"/>
      <rect x="790" y="126" width="290" height="114" rx="12"/>
    </g>
    <g stroke="#5eead4" stroke-width="3" fill="none">
      <path d="M344 183h54m-10-7 10 7-10 7"/>
      <path d="M720 183h54m-10-7 10 7-10 7"/>
    </g>
    <g fill="#f8fafc" font-size="22" font-weight="650">
      <text x="64" y="164">Your workspace</text>
      <text x="438" y="164">OpenCode</text>
      <text x="814" y="164">oMLX + Qwen</text>
    </g>
    <g fill="#cbd5e1" font-size="15">
      <text x="64" y="194">Code, tests and a running app</text>
      <text x="64" y="218">Review changes before accepting</text>
      <text x="438" y="194">Plan · edit · test · browse</text>
      <text x="438" y="218">Native sessions and permissions</text>
      <text x="814" y="194">Local model on your Mac</text>
      <text x="814" y="218">One generation at a time</text>
    </g>
    <rect x="40" y="266" width="1040" height="54" rx="10" fill="#123b3b"/>
    <text x="560" y="300" text-anchor="middle" fill="#ccfbf1" font-size="17">KRYN: verified installation · resource guards · session evidence · rollback</text>
  </g>
</svg>
