<svg width="720" height="348" viewBox="0 0 720 348" xmlns="http://www.w3.org/2000/svg" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Helvetica, Arial, sans-serif" role="img" aria-labelledby="kreq-t kreq-d">
<title id="kreq-t">Model requests on tasks where both arms reached the same result</title>
<desc id="kreq-d">Four tasks where KRYN and native OpenCode got the same grade. Terminal-Bench nginx logging, both passed: 11 requests each. Terminal-Bench sqlite with gcov, both failed: KRYN 23 requests, native 128, after native repeated the same search 112 times. Pagination task, both 6 of 6: KRYN 8 requests, native 12. Rate-limit task, both 7 of 8: KRYN 34 requests, native 12.</desc>
<rect width="720" height="348" fill="#fafafa"/>
<text x="24" y="34" font-size="12" font-weight="600" fill="#0a0a0a">Same grade, different cost: model requests per task</text>
<text x="24" y="52" font-size="11" fill="#71717a">fewer is better; KRYN used fewer on two of these four, tied one, and used more on one</text>
<g font-size="10" fill="#71717a"><rect x="24" y="64" width="10" height="10" fill="#0a0a0a"/><text x="40" y="73">OpenCode + KRYN</text><rect x="150" y="64" width="10" height="10" fill="#fff" stroke="#0a0a0a"/><text x="166" y="73">native OpenCode</text></g>
<text x="24" y="108" font-size="11" font-weight="600" fill="#0a0a0a">Terminal-Bench: nginx logging</text><text x="24" y="123" font-size="10" fill="#71717a">both passed</text>
<rect x="230" y="98" width="28.6" height="12" fill="#0a0a0a"/><text x="264.6" y="108" font-size="10" fill="#0a0a0a">11</text>
<rect x="230" y="114" width="28.6" height="12" fill="#fff" stroke="#0a0a0a"/><text x="264.6" y="124" font-size="10" fill="#0a0a0a">11</text>
<text x="24" y="160" font-size="11" font-weight="600" fill="#0a0a0a">Terminal-Bench: sqlite + gcov</text><text x="24" y="175" font-size="10" fill="#71717a">both failed</text>
<rect x="230" y="150" width="59.8" height="12" fill="#0a0a0a"/><text x="295.8" y="160" font-size="10" fill="#0a0a0a">23</text>
<rect x="230" y="166" width="332.8" height="12" fill="#fff" stroke="#0a0a0a"/><text x="556.8" y="176" font-size="10" fill="#0a0a0a" text-anchor="end">128 · same search repeated 112 times</text>
<text x="24" y="212" font-size="11" font-weight="600" fill="#0a0a0a">Pagination task</text><text x="24" y="227" font-size="10" fill="#71717a">both 6/6</text>
<rect x="230" y="202" width="20.8" height="12" fill="#0a0a0a"/><text x="256.8" y="212" font-size="10" fill="#0a0a0a">8</text>
<rect x="230" y="218" width="31.2" height="12" fill="#fff" stroke="#0a0a0a"/><text x="267.2" y="228" font-size="10" fill="#0a0a0a">12</text>
<text x="24" y="264" font-size="11" font-weight="600" fill="#0a0a0a">Rate-limit task</text><text x="24" y="279" font-size="10" fill="#71717a">both 7/8</text>
<rect x="230" y="254" width="88.4" height="12" fill="#0a0a0a"/><text x="324.4" y="264" font-size="10" fill="#0a0a0a">34</text>
<rect x="230" y="270" width="31.2" height="12" fill="#fff" stroke="#0a0a0a"/><text x="267.2" y="280" font-size="10" fill="#0a0a0a">12</text>
<text x="24" y="336" font-size="10" fill="#71717a">Development data from the KRYN research receipts; one run per arm per task.</text>
</svg>
