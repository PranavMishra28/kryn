name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-and-package:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      # Release tags resolved through the primary GitHub API on 2026-09-22.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          package-manager-cache: false
      # The shell boundary requires an owner-controlled interpreter, as installed
      # on the Mac. Hosted setup-python resolves to a shared system framework.
      - name: Owned Python for boundary tests
        run: |
          python -m pip install 'uv==0.11.16'
          export UV_PYTHON_INSTALL_DIR="$RUNNER_TEMP/kryn-python"
          uv python install --no-bin 3.13.13
          kryn_python="$(uv python find --managed-python 3.13.13)"
          dirname "$kryn_python" >> "$GITHUB_PATH"
      - name: Existing offline regressions
        run: make check
      - name: Curated wheel and outside-checkout smoke
        run: make package-smoke
      - name: Tracked source remains unchanged
        run: git diff --exit-code
